<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>PROJECT_LEGION</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#232a34; --text:#e6edf3; --dim:#8b949e;
    --a:#5b9bd5; --b:#e06c4f; --ok:#6ee7a0; --warn:#ffd34d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100%;max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
  header h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.06em}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
  .screen{display:none;flex:1;min-height:0;flex-direction:column}
  .screen.on{display:flex}

  /* ---- экран формации ---- */
  .formation-wrap{display:flex;gap:12px;padding:12px;flex:1;min-height:0;overflow:hidden}
  .grid-panel{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
  .hint{color:var(--dim);font-size:12px}
  /* Сетка обязана помещаться целиком: расстановка, которую надо скроллить,
     перестаёт читаться как поле боя. Высоту задаёт контейнер, не содержимое. */
  .grid{display:grid;gap:5px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:8px;flex:1;min-height:0;grid-auto-rows:1fr}
  .cell{border:1px dashed #2c3440;border-radius:6px;display:flex;
    align-items:center;justify-content:center;position:relative;cursor:pointer;
    min-height:0;transition:background .12s,border-color .12s}
  .cell.drop{border-color:var(--a);background:#16283a}
  .cell.filled{border-style:solid;border-color:#2f3947;background:#1b222c}
  .cell .lbl{font-size:9px;color:#5a6470;position:absolute;top:2px;left:4px;pointer-events:none}
  .cell svg{width:46%;height:46%;max-width:52px;max-height:52px}
  .roster{width:182px;display:flex;flex-direction:column;gap:5px;overflow-y:auto;min-height:0}
    .unit{display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:grab;user-select:none;flex:none}
  .unit:active{cursor:grabbing}
  .unit.sel{border-color:var(--a);background:#16283a}
  .unit svg{width:20px;height:20px;flex:none}
  .unit .nm{font-size:12px}
  .bar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
  button{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:#3a4553}
  button.primary{background:var(--a);border-color:var(--a);color:#08121c;font-weight:600}
  button.on{border-color:var(--a);color:var(--a)}
  .sp{flex:1}

  /* ---- экран боя ---- */
  #canvas-host{flex:1;min-height:0;position:relative;background:#0b0e12}
  #canvas-host canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;top:8px;left:0;right:0;display:flex;gap:10px;
    padding:0 12px;align-items:center;pointer-events:none}
  .hpbar{flex:1;height:8px;background:#1a1d22;border-radius:4px;overflow:hidden}
  .hpbar i{display:block;height:100%;transition:width .12s linear}
  .timer{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;min-width:44px;text-align:center}

  /* ---- экран результата ---- */
  .result{padding:18px;overflow:auto}
  .verdict{font-size:22px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.num{font-variant-numeric:tabular-nums}
  .who{display:flex;align-items:center;gap:7px}
  .who svg{width:16px;height:16px;flex:none}
  .icons{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;min-width:104px}
  .stat .k{color:var(--dim);font-size:11px;display:flex;align-items:center;gap:5px}
  .stat .v{font-size:19px;font-variant-numeric:tabular-nums;margin-top:2px}
  .dead{color:var(--b)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>PROJECT_LEGION</h1>
    <span class="tag" id="phase">фаза 2</span>
    <span class="sp"></span>
    <span class="tag" id="seedtag"></span>
  </header>

  <section id="scr-formation" class="screen on">
    <div class="formation-wrap">
      <div class="grid-panel">
        <div class="hint">Перетащи юнита в клетку. Ряд 1 — фронт, ряд 4 — тыл. Пустой лейн заставит врага бежать через всё поле.</div>
        <div class="grid" id="grid"></div>
        <div class="hint" id="slots"></div>
      </div>
      <div class="roster" id="roster"></div>
    </div>
    <div class="bar">
      <button id="btn-auto">Авто</button>
      <button id="btn-clear">Очистить</button>
      <span class="sp"></span>
      <button class="primary" id="btn-fight">В бой</button>
    </div>
  </section>

  <section id="scr-battle" class="screen">
    <div id="canvas-host">
      <div class="hud">
        <div class="hpbar"><i id="hp-a" style="width:100%;background:#5b9bd5"></i></div>
        <div class="timer" id="timer">0.0с</div>
        <div class="hpbar"><i id="hp-b" style="width:100%;background:#e06c4f"></i></div>
      </div>
    </div>
    <div class="bar">
      <button id="sp1" class="on">1×</button>
      <button id="sp2">2×</button>
      <button id="sp4">4×</button>
      <span class="sp"></span>
      <button id="btn-skip">Пропустить бой</button>
    </div>
  </section>

  <section id="scr-result" class="screen">
    <div class="result">
      <h2 class="verdict" id="verdict"></h2>
      <div class="sub" id="verdict-sub"></div>
      <div class="icons" id="icons"></div>
      <table id="report"></table>
    </div>
    <div class="bar">
      <button id="btn-again">Тот же бой заново</button>
      <span class="sp"></span>
      <button class="primary" id="btn-back">К формации</button>
    </div>
  </section>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
