name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Гейт 1: типы (03_TECH §8 — ноль ошибок)
      - name: Типы
        run: pnpm typecheck

      # Гейт 2-5 разом. Внутри прогона:
      #   no-float.test.ts  — барьер детерминизма (Math.random, Date, async, for-in...)
      #   determinism.test  — 1000 прогонов одного сида + fuzz на 200 боёв
      #   golden.test       — 4 эталонных реплея, посубсистемные хеши
      #   battle.test       — перф-гейт: 840 юнитов, средний тик < 4 мс
      - name: Тесты, детерминизм, golden-реплеи, перф-гейт
        run: pnpm test

      # Отдельно, чтобы цифры fixed-point были видны в логе прогона
      - name: Бенчмарк fixed-point
        run: pnpm bench
