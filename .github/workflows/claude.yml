name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Аутентификация по API-ключу. Секрет должен лежать в разделе
          # Settings -> Secrets and variables -> ACTIONS
          # (раздел Agents читает только Copilot, Actions его не видит):
          #   gh secret set ANTHROPIC_API_KEY -R NikitaOrela/project-legion
          #
          # Чтобы перейти на оплату подпиской: выпустить токен командой
          #   env -u ANTHROPIC_API_KEY claude setup-token
          # положить в секрет CLAUDE_CODE_OAUTH_TOKEN и заменить строку ниже на
          #   claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
