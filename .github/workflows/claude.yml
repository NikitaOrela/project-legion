name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Аутентификация по ПОДПИСКЕ. Токен выпускается локально:
          #   claude setup-token
          # и кладётся в секрет раздела ACTIONS (раздел Agents читает только
          # Copilot, workflow его не видит):
          #   gh secret set CLAUDE_CODE_OAUTH_TOKEN -R NikitaOrela/project-legion
          #
          # Откат на поштучную оплату API — заменить строку ниже на:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
